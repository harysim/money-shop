<title>متجر النقود</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen app. A 16:9 "shop scene" (SVG background + HTML overlays) sits in the middle,
   the wallet row under it, one big action under that. Everything else stays off-screen. */
:root{
  --bg:#EAF1ED; --card:#FFFFFF; --ink:#16302A; --muted:#5B6F68; --line:#CFDDD6;
  --accent:#0E6B50; --accent-ink:#FFFFFF; --sun:#F2B33D;
  --good:#1E8A5A; --good-bg:#DDF2E6; --soft-bad:#B5651D; --soft-bad-bg:#FCEBD8;
  --tray:#F4F8F6;
  --wall:#F7EFE3; --wall2:#EADFCE; --floor:#D9C7AE; --wood:#C98F5A; --wood2:#E0B07E; --shelf:#8D6744;
  --font:"Readex Pro","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif; --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A17;--card:#182622;--ink:#E8F1EC;--muted:#9DB2AA;--line:#2B3D37;--accent:#35B488;--accent-ink:#06261B;
  --good:#5FD39C;--good-bg:#173A2B;--soft-bad:#F0A766;--soft-bad-bg:#3A2A1A;--tray:#13201C;
  --wall:#2A2F36;--wall2:#22272D;--floor:#3A3028;--wood:#8A5F3C;--wood2:#A97A50;--shelf:#5E4530;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A17;--card:#182622;--ink:#E8F1EC;--muted:#9DB2AA;--line:#2B3D37;--accent:#35B488;--accent-ink:#06261B;
  --good:#5FD39C;--good-bg:#173A2B;--soft-bad:#F0A766;--soft-bad-bg:#3A2A1A;--tray:#13201C;
  --wall:#2A2F36;--wall2:#22272D;--floor:#3A3028;--wood:#8A5F3C;--wood2:#A97A50;--shelf:#5E4530;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
#app{max-width:960px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:10px 24px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
button:disabled{cursor:default}
[hidden]{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.brand .dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#E9C46A 0 45%,#C9CDD2 46% 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.bar .group{display:flex;gap:10px}
.iconbtn{min-width:64px;height:64px;border-radius:18px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;padding:0 14px}
.iconbtn svg{width:30px;height:30px}
.iconbtn.speak{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* stage */
.stage{flex:1;background:var(--card);border-radius:28px;border:2px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:flex-start;text-align:center}
.prompt{font-size:clamp(22px,4.5vw,32px);font-weight:700;text-wrap:balance;line-height:1.4}
.sub{color:var(--muted);font-size:18px}
.caption{min-height:30px;color:var(--muted);font-size:17px}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun)}
.lvlhead{display:flex;align-items:center;gap:14px;width:100%;justify-content:center;flex-wrap:wrap}
.lvlhead .sub{font-weight:600}

/* menu */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%}
.lvl{background:var(--tray);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:16px;text-align:start;min-height:130px}
.lvl:hover{border-color:var(--accent)}
.lvl .art{flex:none;width:92px;height:72px;display:flex;align-items:center;justify-content:center;gap:4px}
.lvl .art .ico{width:56px;height:56px}
.lvl b{display:block;font-size:22px}
.lvl span.d{color:var(--muted);font-size:16px}
.lvl .stars{color:var(--sun);font-size:18px;letter-spacing:2px;margin-top:4px}
.lvl .stars em{font-style:normal;opacity:.25}
.start{background:var(--accent);color:var(--accent-ink);font-size:26px;font-weight:700;padding:22px 48px;border-radius:24px}

/* icons */
.ico{width:64px;height:64px;display:block}

/* ===== scene ===== */
.scene{position:relative;width:100%;max-width:820px;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:var(--wall);user-select:none}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute}
.shelf{left:5%;top:12%;width:32.5%;height:42%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.shelf .slot{display:flex;align-items:flex-end;justify-content:center;padding-bottom:1%}
.shelf .item{width:72%;max-width:84px;aspect-ratio:1;padding:0;border-radius:12px}
.shelf .item .ico{width:100%;height:100%}
.shelf .item.gone{visibility:hidden}
.shelf .item.glow{box-shadow:0 0 0 5px var(--sun),0 0 24px var(--sun);border-radius:14px}
.citem{left:62%;top:42.5%;width:11%;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}
.citem .ico{width:100%;height:100%}
.citem.pop{animation:pop .4s ease-out}
.tagov{left:58%;top:22%;display:flex;justify-content:center;width:20%}
.tag{background:var(--sun);color:#3A2600;border-radius:12px;padding:2px 12px;font-weight:700;font-size:clamp(14px,2.6vw,26px);display:flex;align-items:baseline;gap:6px;white-space:nowrap;position:relative;font-variant-numeric:tabular-nums}
.tag::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--sun);border-bottom:0}
.tag small{font-size:.55em;font-weight:600}
.tag.pulse{animation:pulse 1s ease-in-out 2}
.trayov{left:74%;top:62%;width:24%;height:30%;border:3px dashed rgba(255,255,255,.7);border-radius:14px;display:flex;flex-wrap:wrap;gap:3%;align-content:flex-start;justify-content:center;padding:6px;gap:6px;background:rgba(255,255,255,.08);transition:background .2s,border-color .2s}
.trayov.over{background:rgba(242,179,61,.35);border-color:var(--sun)}
.trayov .money{cursor:pointer}
.changeov{left:50%;top:63%;width:22%;height:30%;display:flex;flex-wrap:wrap;gap:3%;align-content:flex-start;justify-content:center;padding:2%}
.listov{left:40%;top:6%;width:18%;background:rgba(255,255,255,.9);color:#222;border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.listov h4{margin:0;font-size:clamp(10px,1.6vw,15px);text-align:center;font-weight:700}
.listov .li{display:flex;align-items:center;gap:6px;background:#f3f3f3;border-radius:8px;padding:2px 4px}
.listov .li .ico{width:clamp(18px,4vw,36px);height:clamp(18px,4vw,36px)}
.listov .li .chk{margin-inline-start:auto;width:clamp(14px,2.6vw,22px);height:clamp(14px,2.6vw,22px);border-radius:50%;border:2px solid #999}
.listov .li.done .chk{background:var(--good);border-color:var(--good)}
.listov .li.done .chk::after{content:"✓";color:#fff;font-size:.75em;display:block;text-align:center;line-height:1.5}
.bubble{left:44%;top:14%;background:#fff;color:#222;border-radius:14px;padding:4px 10px;font-weight:600;font-size:clamp(11px,1.9vw,17px);box-shadow:0 2px 6px rgba(0,0,0,.15);max-width:28%;text-align:center;opacity:0;transition:opacity .3s}
.bubble.show{opacity:1}
.bubble::after{content:"";position:absolute;right:18%;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
/* characters */
.girl .out,.cashier .out{display:none}
.girl.arm-out .out{display:block}.girl.arm-out .rest{display:none}
.cashier.arm-out .out{display:block}
.mouth{transition:d .3s}
.happy .mouth{d:path("M408 209 Q420 224 432 209")}
.cashier.happy .cmouth{d:path("M690 210 Q700 222 710 210")}

/* ===== money ===== */
.money{display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none;user-select:none;transition:transform .15s;--k:1;font-size:calc(var(--w)*var(--k)*.19);touch-action:none}
.money.sm{--k:.56}.money.lg{--k:1.35}.money.xl{--k:1.9}
.money .ar{font-weight:700;position:relative;z-index:1;line-height:1}
.money .en{position:absolute;z-index:1;font-size:.5em;font-weight:600;opacity:.95;line-height:1}
.note{--w:150px;width:calc(var(--w)*var(--k));height:calc(var(--w)*var(--k)*.47);border-radius:.35em;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.18);overflow:hidden}
.note::before{content:"";position:absolute;inset:6%;border:1.5px solid rgba(255,255,255,.5);border-radius:.25em}
.note .orn{position:absolute;inset-inline-start:7%;top:16%;width:30%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.4) 0 14deg,transparent 14deg 45deg);box-shadow:inset 0 0 0 .12em rgba(255,255,255,.35)}
.note .ar{font-size:1.9em;inset-inline-end:10%;position:absolute;top:50%;transform:translateY(-54%)}
.note .en{inset-inline-start:9%;bottom:9%}
.note .u{position:absolute;inset-inline-end:10%;bottom:8%;font-size:.58em;z-index:1;opacity:.95}
.n5{--w:150px;background:linear-gradient(135deg,#7E55A6,#5C3C80)}
.n10{--w:158px;background:linear-gradient(135deg,#A2703F,#7A522B)}
.n50{--w:166px;background:linear-gradient(135deg,#2F8E5B,#1E6743)}
.n100{--w:174px;background:linear-gradient(135deg,#B9404A,#8C2C34)}
.coin{--w:88px;width:calc(var(--w)*var(--k));height:calc(var(--w)*var(--k));border-radius:50%;color:#3A2E12;box-shadow:0 2px 0 rgba(0,0,0,.22)}
.coin .ar{font-size:1.9em}
.coin .en{bottom:16%;left:50%;transform:translateX(-50%)}
.c1{background:radial-gradient(circle,#EBC765 0 54%,#C8CDD3 55% 100%)}
.c2{background:radial-gradient(circle,#D4D8DD 0 54%,#E2B850 55% 100%)}
.money.lifted{opacity:.35}
.dragging{position:fixed;z-index:50;pointer-events:none;margin:0;transform:scale(1.05);filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.money.glow{box-shadow:0 0 0 5px var(--sun),0 0 26px var(--sun)}
.money.dim{opacity:.3}

/* wallet */
.wallet{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;width:100%;min-height:80px;background:var(--tray);border-radius:var(--r);padding:12px;border:2px solid var(--line)}
.wallet .lbl{width:100%;color:var(--muted);font-size:16px;font-weight:600}
.wallet.hl{border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 30%,transparent)}
.wallet button{padding:4px;border-radius:14px;touch-action:none}
.wallet button:active .money{transform:scale(.94)}

/* option buttons */
.opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.opt{padding:12px 14px;border-radius:22px;border:3px solid transparent;background:var(--tray);min-width:120px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .2s,border-color .2s}
.opt .pile{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:170px}
.opt .num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.opt .num small{font-size:15px;font-weight:600;margin-inline-start:4px}
.opt.dim{opacity:.3}
.opt.glow{border-color:var(--sun);box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 30%,transparent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}

/* money wall */
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;width:100%;align-items:center;justify-items:center}
.wall button{padding:10px;border-radius:18px;background:var(--tray);border:2px solid var(--line);display:grid;place-items:center;min-height:130px;width:100%}
.wall button.sel{border-color:var(--sun)}
.bigview{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:150px;justify-content:center}
.eqrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:110px}
.eqrow .eq{font-size:40px;font-weight:700}
.eqrow .group{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:300px}

.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.big{min-width:150px;min-height:72px;border-radius:20px;font-size:24px;font-weight:700;padding:0 28px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.big svg{width:30px;height:30px}
.big.primary{background:var(--accent);color:var(--accent-ink)}
.big.primary.glow{box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 45%,transparent)}
.big.yes{background:var(--good-bg);color:var(--good);border:3px solid var(--good)}
.big.no{background:var(--soft-bad-bg);color:var(--soft-bad);border:3px solid var(--soft-bad)}
.big.ghost{background:var(--tray);border:2px solid var(--line)}
.feedback{min-height:48px;font-size:22px;font-weight:700;border-radius:16px;padding:8px 18px}
.feedback.good{background:var(--good-bg);color:var(--good)}
.feedback.soft{background:var(--soft-bad-bg);color:var(--soft-bad)}
.count{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.count span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.count span.now{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,var(--card))}
.meterwrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.meter{position:relative;height:22px;border-radius:11px;background:var(--line);overflow:visible}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:11px;transition:width .4s}
.meter.over i{background:var(--soft-bad)}.meter.done i{background:var(--good)}
.meter .mark{position:absolute;top:-8px;width:4px;height:38px;background:var(--sun);border-radius:2px;transform:translateX(-50%)}
.meter .mark::after{content:attr(data-l);position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}

/* reward */
.rewardshelf{position:relative;width:100%;max-width:560px;height:120px;background:linear-gradient(transparent 0 70%,var(--shelf) 70% 82%,transparent 82%);display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-bottom:36px}
.rewardshelf .ico{width:64px;height:64px;animation:pop .5s ease-out}
.celebrate{font-size:60px;color:var(--sun);letter-spacing:6px}

/* teacher */
.teacher{text-align:start;align-items:stretch;justify-content:flex-start}
.teacher h2{margin:0;font-size:24px}
.teacher h3{margin:12px 0 0;font-size:19px}
.teacher p{margin:0;color:var(--muted);line-height:1.7;max-width:65ch}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.setting{background:var(--tray);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.setting label{font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:16px}
.seg button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.scriptwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{background:var(--tray);font-weight:600;position:sticky;top:0}
td code{font-family:ui-monospace,Menlo,monospace;font-size:14px;direction:ltr;unicode-bidi:isolate}
td button{background:var(--tray);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--good-bg);color:var(--good)}
.pill.off{background:var(--tray);color:var(--muted)}
.foot{text-align:center}.foot a{color:var(--muted);font-size:15px}

/* start page / profiles */
.hero{position:relative;width:100%;max-width:820px}
.hero .scene{aspect-ratio:16/8}
.float{position:absolute;font-size:clamp(22px,4vw,38px);line-height:1;animation:floaty 4s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}
.who{font-size:24px;font-weight:700}
.profiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
.pcard{width:150px;min-height:150px;border-radius:22px;background:var(--tray);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center}
.pcard:hover{border-color:var(--accent)}
.pcard .av{font-size:56px;line-height:1}
.pcard b{font-size:20px;overflow-wrap:anywhere}
.pcard.add{border-style:dashed}
.pcard .av.plus{font-size:48px;color:var(--accent);font-weight:700}
.namebox{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:520px}
.namebox input{font:inherit;font-size:28px;font-weight:700;text-align:center;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.namebox input:focus{outline:none;border-color:var(--accent)}
.avgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.avgrid button{font-size:40px;line-height:1;width:68px;height:68px;border-radius:18px;background:var(--tray);border:3px solid transparent}
.avgrid button.on{border-color:var(--accent);background:var(--good-bg)}
.greet{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.greet .av{font-size:48px;line-height:1}
.greet .prompt{margin:0}
.linkbtn{color:var(--muted);font-size:15px;text-decoration:underline}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti span{position:absolute;top:-40px;line-height:1;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(380deg)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.pop{animation:pop .4s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){.stage{padding:12px}.big{min-width:120px;min-height:64px;font-size:20px}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-juice" viewBox="0 0 64 64"><rect x="16" y="14" width="32" height="42" rx="4" fill="#E8663D"/><rect x="16" y="14" width="32" height="10" rx="4" fill="#F28B5B"/><rect x="20" y="30" width="24" height="16" rx="3" fill="#FFF3E6"/><circle cx="32" cy="38" r="5" fill="#E8663D"/><rect x="40" y="2" width="4" height="16" rx="2" fill="#2F6F9F" transform="rotate(12 42 10)"/></symbol>

   ========================================================= */
const DEFAULTS={input:'both',money:'small',hints:2,rounds:5};
let S=Object.assign({},DEFAULTS,store('ms_settings')||{});
function saveSettings(){store('ms_settings',S)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const moneySet=()=>S.money==='all'?[1,2,5,10,50,100]:[1,2,5,10];

/* =========================================================
   3) VOICE — recorded clip if present, else device voice
   ========================================================= */
let recorded=new Set(), arVoice=null, voiceToken=0, lastSay=[];
function pickVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang)); arVoice=vs.find(v=>/SA/i.test(v.lang))||vs[0]||null; }
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
fetch('audio/manifest.json').then(r=>r.ok?r.json():[]).then(a=>{recorded=new Set(a)}).catch(()=>{});
function playFile(key,tok){ return new Promise(res=>{ const a=new Audio('audio/'+key+'.mp3'); a.onended=res; a.onerror=()=>{recorded.delete(key);ttsSpeak(PHRASES[key],tok).then(res)}; a.play().catch(()=>res()); }); }
function ttsSpeak(text,tok){ return new Promise(res=>{ if(tok!==voiceToken||!('speechSynthesis' in window)) return res(); const u=new SpeechSynthesisUtterance(text); u.lang=arVoice?arVoice.lang:'ar-SA'; if(arVoice) u.voice=arVoice; u.rate=0.85; let done=false;const fin=()=>{if(!done){done=true;res()}}; u.onend=fin;u.onerror=fin; setTimeout(fin,1500+text.length*160); speechSynthesis.speak(u); }); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function say(keys,remember=true){
  keys=keys.filter(Boolean); if(remember) lastSay=keys;
  const tok=++voiceToken; if('speechSynthesis' in window) speechSynthesis.cancel();
  let buf=[]; const flush=async()=>{ if(buf.length){const t=buf.map(k=>PHRASES[k]).join('، ');buf=[];await ttsSpeak(t,tok);} };
  for(const k of keys){ if(tok!==voiceToken) return; if(recorded.has(k)){ await flush(); if(tok!==voiceToken) return; await playFile(k,tok); await wait(100); } else buf.push(k); }
  await flush();
}

/* =========================================================
   4) DRAWING — money, icons, the shop scene
   ========================================================= */
function money(v,size){
  const el=document.createElement('span'); el.dataset.v=v;
  const coin=v<=2;
  el.className='money '+(coin?'coin c':'note n')+v+(size?' '+size:'');
  el.innerHTML=coin?`<span class="ar">${AR(v)}</span><span class="en">${v}</span>`:`<span class="orn"></span><span class="ar">${AR(v)}</span><span class="en">${v}</span><span class="u">ريال</span>`;
  el.setAttribute('role','img'); el.setAttribute('aria-label',amountText(v).replace(/[ً-ْ]/g,''));
  return el;
}
function breakDown(n,set){ set=(set||[100,50,10,5,2,1]).slice().sort((a,b)=>b-a); const out=[]; for(const d of set){while(n>=d){out.push(d);n-=d}} return out; }
const icon=k=>`<svg class="ico" aria-hidden="true"><use href="#ic-${k}"/></svg>`;
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}

const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

const strip=s=>s.replace(/[ً-ْ]/g,'');

function buildScene(opts={}){

  const bubble=h('<div class="ov bubble"></div>');

  const sc={root,svg,girl,cashier,shelf,citem,tagov,tray,change,bubble,trayVals:[],shelfBtns:{}};
  sc.setShelf=(items,onPick)=>{ shelf.innerHTML=''; sc.shelfBtns={}; items.forEach(it=>{ const slot=h('<div class="slot"></div>'); const b=h(`<button class="item" aria-label="${it.plain}">${icon(it.k)}</button>`); if(onPick) b.onclick=()=>onPick(it,b); else b.disabled=true; slot.append(b); shelf.append(slot); sc.shelfBtns[it.k]=b; }); };
  sc.putOnCounter=async(it,fromBtn)=>{ if(fromBtn){ const g=h(icon(it.k)); g.style.width=fromBtn.offsetWidth+'px'; g.style.height=fromBtn.offsetHeight+'px'; fromBtn.classList.add('gone'); await fly(g,fromBtn.getBoundingClientRect(),citem.getBoundingClientRect()); } citem.innerHTML=icon(it.k); citem.classList.remove('pop'); void citem.offsetWidth; citem.classList.add('pop'); };

  sc.setTag=(p,label)=>{ tagov.innerHTML=p==null?'':`<span class="tag">${label?'<small>'+label+'</small>':''}${p}<small>ريال</small></span>`; };
  sc.pulseTag=()=>{ const t=tagov.querySelector('.tag'); if(t){t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse');} };
  sc.addTray=(v,onRemove)=>{ const m=money(v,'sm'); if(onRemove){ m.onclick=()=>onRemove(v,m); m.setAttribute('aria-label','إرجاع '+v); } tray.append(m); sc.trayVals.push(v); m.classList.add('pop'); return m; };
  sc.removeTray=(m)=>{ const v=+m.dataset.v; const i=sc.trayVals.indexOf(v); if(i>-1) sc.trayVals.splice(i,1); m.remove(); };
  sc.trayTotal=()=>sc.trayVals.reduce((a,b)=>a+b,0);
  sc.clearTray=()=>{tray.innerHTML='';sc.trayVals=[]};
  sc.addChange=(v)=>{ const m=money(v,'sm'); m.classList.add('pop'); change.append(m); return m; };

  sc.girlArm=(out)=>girl.classList.toggle('arm-out',!!out);

  sc.speak=(text)=>{ bubble.textContent=text; bubble.classList.toggle('show',!!text); };

}
function fly(node,from,to){ return new Promise(res=>{ node.classList.add('dragging'); node.style.transform='none'; node.style.left=from.left+'px'; node.style.top=from.top+'px'; document.body.append(node); const w=node.offsetWidth,hh=node.offsetHeight; requestAnimationFrame(()=>requestAnimationFrame(()=>{ node.style.transition='left .65s cubic-bezier(.4,0,.2,1),top .65s cubic-bezier(.4,0,.2,1)'; node.style.left=(to.left+to.width/2-w/2)+'px'; node.style.top=(to.top+to.height/2-hh/2)+'px'; })); setTimeout(()=>{node.remove();res()},720); }); }
function inRect(x,y,r){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}

/* Drag-or-tap for wallet money. zone() returns the drop target element. */
function enableDrag(el,{onTap,onDrop,zone}){
  el.addEventListener('pointerdown',e=>{
    if(el.disabled) return; e.preventDefault();
    const r=el.getBoundingClientRect(), sx=e.clientX, sy=e.clientY, ox=sx-r.left, oy=sy-r.top; let moved=false, ghost=null;
    const move=ev=>{ if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ if(S.input==='tap') return; moved=true; ghost=el.cloneNode(true); ghost.classList.add('dragging'); ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px'; document.body.append(ghost); el.classList.add('lifted'); }
      if(ghost){ ghost.style.left=(ev.clientX-ox)+'px'; ghost.style.top=(ev.clientY-oy)+'px'; const z=zone(); if(z) z.classList.toggle('over',inRect(ev.clientX,ev.clientY,z.getBoundingClientRect())); } };
    const up=ev=>{ el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
      const z=zone(); if(z) z.classList.remove('over'); el.classList.remove('lifted');
      if(!moved){ onTap&&onTap(); return; }
      if(z&&inRect(ev.clientX,ev.clientY,z.getBoundingClientRect())){ ghost.remove(); onDrop&&onDrop(); }
      else { ghost.style.transition='left .25s,top .25s,opacity .25s'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px'; ghost.style.opacity='0'; setTimeout(()=>ghost.remove(),260); } };
    el.setPointerCapture(e.pointerId); el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  });
}

  const price=rand(AMOUNTS.filter(n=>n>=3&&n<=(state.round<2?15:30))); const enough=Math.random()<0.5;
  const have=enough?rand(AMOUNTS.filter(n=>n>=price&&n<=price+10)):rand(AMOUNTS.filter(n=>n<price&&n>=Math.max(1,price-8))); let wrong=0;
  $stage.innerHTML=header(L);
  const sc=buildScene(); sc.setShelf(pickItems(4)); sc.putOnCounter(item); sc.setTag(price,'السعر');
  const wrap=walletWrap(sc); const w=wallet(breakDown(have,[10,5,2,1]),{label:'معكِ '+have+' ريال'});
  const fb=h('<div class="feedback"></div>'), a=h('<div class="actions"></div>');
  const yes=h('<button class="big yes">نعم، يكفي</button>'), no=h('<button class="big no">لا، لا يكفي</button>');
  const answer=ans=>{ if(ans===enough){ yes.disabled=no.disabled=true; wrap.insertBefore(meterEl(have,price),fb); if(enough){sc.happy(true);sc.girlArm(true);} feedback(fb,enough?'نعم، المبلغ يكفي':'لا، المبلغ لا يكفي','good'); say([praise(),enough?'enough_yes':'enough_no'],false); if(enough) state.bought.push(item.k); nextRound(wrong===0); }
    else { wrong++; feedback(fb,'انظري مرة أخرى: معكِ '+have+'، والسعر '+price,'soft'); say(['retry','w_withyou',amt(have),'w_price',amt(price)],false); if(wrong>=S.hints){ (enough?yes:no).classList.add('glow'); wrap.insertBefore(meterEl(have,price),fb); } } };
  yes.onclick=()=>answer(true); no.onclick=()=>answer(false); a.append(yes,no);
  wrap.append(w,h('<div class="prompt">هل يكفي المبلغ؟</div>'),fb,a); $stage.append(wrap);
  say(['w_withyou',amt(have),'w_price',amt(price),'q_enough']);
}

/* =========================================================
   9) LEVEL 4 — CHANGE (counting up)
   ========================================================= */
function makeChangeTask(){ const r=Math.random(), easy=state.round<2; if(easy||r<0.34){return{paid:10,price:1+Math.floor(Math.random()*9)};} if(r<0.67){return{paid:50,price:rand([20,25,30,35,40,45])};} return{paid:100,price:rand([30,40,50,60,70,80,90])}; }
function countSteps(price,paid){ const s=[];let x=price; if(paid===10){while(x<paid){x+=1;s.push(x)}return s;} if(x%10===5){x+=5;s.push(x)} while(x<paid){x+=10;s.push(x)} return s; }
async function countUp(sc,counter,price,paid,narrate){ // cashier counts change onto the counter
  counter.innerHTML=''; sc.clearChange(); sc.cashierArm(true);
  const steps=countSteps(price,paid); const chips=[price,...steps].map(n=>{const s=h('<span>'+n+'</span>');counter.append(s);return s;}); chips[0].classList.add('now');
  await narrate(['count_intro','w_price',amt(price)],'نعدّ من السعر '+price); let prev=price;
  for(let i=0;i<steps.length;i++){ chips[i].classList.remove('now'); chips[i+1].classList.add('now'); sc.addChange(steps[i]-prev); prev=steps[i]; await narrate([amt(steps[i])],String(steps[i])); await wait(150); }
  const ch=paid-price; counter.append(h('<span class="now">الباقي '+ch+'</span>')); await narrate(['w_change',amt(ch)],'الباقي '+ch); sc.cashierArm(false);
}
async function demoChange(body,narrate,id){
  const item=rand(ITEMS), price=7, paid=10, sc=buildScene(); body.append(sc.root);
  sc.setShelf(pickItems(4)); sc.putOnCounter(item); sc.setTag(price,'السعر');
  const w=wallet([10],{label:'معكِ'}); body.append(w); const counter=h('<div class="count"></div>'); body.append(counter);
  await narrate(['d_intro','w_price',amt(price)],'السعر '+price); if(!alive(id)) return;
  await narrate(['d_change_1'],'ليس معها المبلغ بالضبط، تعطي ورقة أكبر'); if(!alive(id)) return;
  sc.girlArm(true); const g=money(paid,'sm'); await fly(g,w.querySelector('button').getBoundingClientRect(),sc.tray.getBoundingClientRect()); sc.addTray(paid);
  await narrate(['w_paid',amt(paid)],'دفعت '+paid); if(!alive(id)) return;
  await narrate(['d_change_2'],'البائعة تعدّ من السعر حتى المبلغ المدفوع'); if(!alive(id)) return;
  await countUp(sc,counter,price,paid,narrate); sc.happy(true);
}
function roundChange(first){
  const L=state.level, item=rand(ITEMS), {paid,price}=makeChangeTask(), change=paid-price; let wrong=0, counting=false;
  const cands=AMOUNTS.filter(n=>n!==change&&Math.abs(n-change)<=10&&n<paid); const opts=shuffle([change,...shuffle(cands).slice(0,2)]);
  $stage.innerHTML=header(L);
  const sc=buildScene(); sc.setShelf(pickItems(4)); sc.putOnCounter(item); sc.setTag(price,'السعر'); sc.girlArm(true); sc.addTray(paid);
  const wrap=walletWrap(sc); const counter=h('<div class="count" aria-live="polite"></div>'); const box=h('<div class="opts"></div>'); const fb=h('<div class="feedback"></div>'); const a=h('<div class="actions"></div>');
  const narrate=async(keys,text)=>{await say(keys,false)};
  const hint=h('<button class="big ghost">عُدّي معي</button>');
  const doCount=async()=>{ if(counting) return; counting=true; await countUp(sc,counter,price,paid,narrate); counting=false; };
  hint.onclick=doCount;
  opts.forEach(v=>{ const b=h(`<button class="opt"><span class="pile"></span><span class="num">${v}<small>ريال</small></span></button>`); breakDown(v,[50,10,5,2,1]).slice(0,8).forEach(x=>b.querySelector('.pile').append(money(x,'sm')));
    b.onclick=()=>{ if(b.classList.contains('dim')) return;
      if(v===change){ b.classList.add('right','pop'); box.querySelectorAll('button').forEach(o=>o.disabled=true); feedback(fb,'أحسنتِ! الباقي '+change+' ريال','good'); sc.happy(true); if(!counter.children.length){ sc.clearChange(); breakDown(change,[50,10,5,2,1]).forEach(x=>sc.addChange(x)); sc.cashierArm(true);} say([praise(),'w_change',amt(change)],false); state.bought.push(item.k); nextRound(wrong===0); }
      else { wrong++; b.classList.add('dim'); feedback(fb,'حاولي مرة أخرى، أو اضغطي «عُدّي معي»','soft'); say(['retry'],false); if(wrong>=S.hints){ doCount().then(()=>{ [...box.children].find(o=>!o.classList.contains('dim')&&!o.classList.contains('right'))?.classList.add('glow'); }); } } };
    box.append(b); });
  a.append(hint);
  wrap.append(h('<div class="prompt">كم ترجع لكِ البائعة؟</div>'),box,counter,fb,a); $stage.append(wrap);
  say(['w_price',amt(price),'w_paid',amt(paid),'q_change']);
}

/* =========================================================
   10) LEVEL 5 — SHOPPING TRIP
   ========================================================= */
const PRICE_OF={juice:3,water:2,shawarma:8,notebook:7,pen:4,charger:15,ball:12,biscuit:5};
function listOv(items){ const l=h('<div class="ov listov"><h4>القائمة</h4></div>'); items.forEach(it=>l.append(h(`<div class="li" data-k="${it.k}">${icon(it.k)}<span class="chk"></span></div>`))); return l; }
async function demoTrip(body,narrate,id){
  const shelfItems=pickItems(4), list=shelfItems.slice(0,2), sc=buildScene(); body.append(sc.root);
  sc.setShelf(shelfItems); const lo=listOv(list); sc.root.append(lo);
  const total=list.reduce((a,it)=>a+PRICE_OF[it.k],0); const w=wallet(breakDown(total,[10,5,2,1]),{label:'المحفظة'}); body.append(w);
  await narrate(['d_intro'],'هذه نورة في المتجر'); if(!alive(id)) return;
  await narrate(['d_trip_1'],'مع نورة قائمة تسوق'); if(!alive(id)) return;
  await narrate(['d_trip_2'],'تأخذ من الرف ما في القائمة فقط'); if(!alive(id)) return;
  let sum=0; for(const it of list){ if(!alive(id)) return; sc.speak(it.plain); await sc.putOnCounter(it,sc.shelfBtns[it.k]); lo.querySelector(`.li[data-k="${it.k}"]`).classList.add('done'); sum+=PRICE_OF[it.k]; sc.setTag(sum,'المجموع'); await narrate(['item_'+it.k,amt(PRICE_OF[it.k])],it.plain+' '+PRICE_OF[it.k]); }
  sc.speak(''); sc.pulseTag(); await narrate(['list_done','w_total',amt(total)],'اكتملت القائمة. المجموع '+total); if(!alive(id)) return;
  sc.girlArm(true); await narrate(['d_trip_3'],'ثم تدفع عند البائعة'); if(!alive(id)) return;
  for(const v of breakDown(total,[10,5,2,1])){ if(!alive(id)) return; const btn=w.querySelector(`button[data-v="${v}"]`); await fly(money(v,'sm'),btn.getBoundingClientRect(),sc.tray.getBoundingClientRect()); sc.addTray(v); await narrate([amt(sc.trayTotal())],'في الطاولة: '+sc.trayTotal()); }
  sc.happy(true); sc.speak('شكراً لكِ!'); await narrate(['thanks'],'شكراً لكِ!');
}
function roundTrip(first){
  const L=state.level, shelfItems=pickItems(4), list=shelfItems.slice(0,2), total=list.reduce((a,it)=>a+PRICE_OF[it.k],0); let wrong=0, sum=0, phase='pick', onCounter=[];
  $stage.innerHTML=header(L);
  const sc=buildScene(); const lo=listOv(list); sc.root.append(lo); sc.girlArm(false);
  const wrap=walletWrap(sc); const fb=h('<div class="feedback"></div>'); const counter=h('<div class="count"></div>');
  const prompt=h('<div class="prompt">خذي ما في القائمة من الرف</div>');
  // wallet: enough money, slightly more than total
  const extra=rand([2,5,10]); const vals=shuffle(breakDown(total,[10,5,2,1]).concat([extra]));
  let w=null, pay=null;
  const addMoney=(v)=>{ if(phase!=='pay') return; sc.addTray(v,(vv,m)=>{sc.removeTray(m);say(sc.trayTotal()?[amt(sc.trayTotal())]:[],false);update();}); update(); say([amt(sc.trayTotal())],false); };
  const update=()=>{ pay.classList.toggle('glow',sc.trayTotal()>=total); };
  const pick=async(it,btn)=>{ if(phase!=='pick'||btn.classList.contains('gone')) return;
    if(list.includes(it)&&!onCounter.includes(it.k)){ onCounter.push(it.k); await sc.putOnCounter(it,btn); lo.querySelector(`.li[data-k="${it.k}"]`).classList.add('done'); sum+=PRICE_OF[it.k]; sc.setTag(sum,'المجموع'); say(['item_'+it.k,amt(PRICE_OF[it.k])],false); lo.querySelectorAll('.li').forEach(x=>x.classList.remove('glow'));
      if(onCounter.length===list.length){ phase='pay'; sc.girlArm(true); prompt.textContent='ادفعي المجموع'; sc.pulseTag(); await say(['list_done','w_total',amt(total)],false); w.hidden=false; pay.hidden=false; } }
    else { wrong++; btn.classList.add('pop'); setTimeout(()=>btn.classList.remove('pop'),400); feedback(fb,'هذا ليس في القائمة','soft'); say(['not_in_list'],false); if(wrong>=S.hints){ const next=list.find(x=>!onCounter.includes(x.k)); sc.shelfBtns[next.k].classList.add('glow'); } } };
  sc.setShelf(shelfItems,pick);
  w=wallet(vals,{drag:true,onAdd:addMoney,zone:()=>sc.tray,label:'المحفظة'}); w.hidden=true;
  pay=h('<button class="big primary">ادفعي</button>'); pay.hidden=true;
  pay.onclick=async()=>{ const t=sc.trayTotal();
    if(t<total){ wrong++; feedback(fb,'المبلغ أقل من المجموع. أضيفي نقوداً','soft'); say(['less'],false); if(wrong>=S.hints){ const need=total-t; const v=[...w.querySelectorAll('button')].map(b=>+b.dataset.v).filter(x=>x<=need).sort((a,b)=>b-a)[0]||1; w.querySelector(`button[data-v="${v}"] .money`)?.classList.add('glow'); } return; }
    pay.disabled=true; w.querySelectorAll('button').forEach(b=>b.disabled=true); sc.happy(true); sc.speak('شكراً لكِ!'); onCounter.forEach(k=>state.bought.push(k));
    if(t===total){ feedback(fb,'أحسنتِ! دفعتِ المجموع بالضبط','good'); await say([praise(),'thanks'],false); }
    else { feedback(fb,'دفعتِ أكثر، والباقي '+(t-total)+' ريال','good'); await say([praise(),'pay_more_change'],false); await countUp(sc,counter,total,t,async(k)=>{await say(k,false)}); }
    nextRound(wrong===0); };
  const a=h('<div class="actions"></div>'); a.append(pay);
  wrap.append(prompt,w,counter,fb,a); $stage.append(wrap);
  say((first?['d_trip_2']:[]).concat(list.map(it=>'item_'+it.k)));
}

/* =========================================================
   11) TEACHER PAGE — settings + recording script
   ========================================================= */
function showTeacher(){
  runId++; $stage.className='stage teacher'; $stage.innerHTML='';
  $stage.append(h('<h2>صفحة المعلمة</h2>'));
  $stage.append(h('<h3>الإعدادات (تُحفظ على هذا الجهاز)</h3>'));
  const grid=h('<div class="settings"></div>');
  const seg=(key,label,opts)=>{ const s=h(`<div class="setting"><label>${label}</label><div class="seg"></div></div>`); const d=s.querySelector('.seg'); opts.forEach(([v,t])=>{ const b=h(`<button class="${S[key]===v?'on':''}">${t}</button>`); b.onclick=()=>{S[key]=v;saveSettings();d.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}; d.append(b); }); return s; };
  grid.append(seg('money','النقود المستخدمة',[['small','١، ٢، ٥، ١٠ فقط'],['all','مع ٥٠ و١٠٠']]));
  grid.append(seg('input','طريقة الدفع',[['both','سحب أو ضغط'],['tap','ضغط فقط']]));
  grid.append(seg('hints','التلميح بعد',[[1,'خطأ واحد'],[2,'خطأين'],[3,'ثلاثة أخطاء']]));
  grid.append(seg('rounds','عدد الجولات',[[3,'٣'],[5,'٥'],[8,'٨']]));
  $stage.append(grid);
  const reset=h('<button class="big ghost" style="align-self:flex-start;font-size:18px;min-height:56px">مسح نجوم الطالبة على هذا الجهاز</button>');
  reset.onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('stars')).forEach(k=>localStorage.removeItem(k))}catch(e){};reset.textContent='تم المسح';}; $stage.append(reset);
  $stage.append(h('<h3>الطالبات على هذا الجهاز</h3>'));
  $stage.append(h('<p>كل طالبة تكتب اسمها مرة واحدة وتختار صورتها، ثم تضغط على بطاقتها في الصفحة الأولى. النجوم تُحفظ لكل اسم على حدة.</p>'));
  const ul=h('<div class="profiles" style="justify-content:flex-start"></div>');
  if(!profiles.length) ul.append(h('<div class="sub">لا توجد أسماء بعد.</div>'));
  profiles.forEach(p=>{ const c=h(`<div class="pcard"><span class="av">${p.emoji}</span><b></b><button class="big ghost" style="min-height:40px;min-width:0;font-size:15px;padding:0 12px">حذف</button></div>`); c.querySelector('b').textContent=p.name;
    c.querySelector('button').onclick=()=>{ profiles=profiles.filter(x=>x.id!==p.id); store('ms_profiles',profiles); if(profile&&profile.id===p.id){profile=null;} c.remove(); }; ul.append(c); });
  $stage.append(ul);
  $stage.append(h('<h3>الاستخدام في الصف</h3>'));
  $stage.append(h('<p>كل لعبة تبدأ بمشاهدة نورة وهي تؤدي المهمة، ثم تؤديها الطالبة بنفسها. يُفضّل وضع نقود حقيقية أمام الطالبة أثناء اللعب لتطابق ما على الشاشة بما في يدها. زر السماعة في الأعلى يعيد آخر جملة.</p>'));
  $stage.append(h('<h3>نص التسجيل الصوتي</h3>'));
  const voiceName=arVoice?arVoice.name+' ('+arVoice.lang+')':'لا يوجد صوت عربي في هذا الجهاز';
  $stage.append(h('<p>الجمل المسجّلة تُشغَّل من مجلد <code dir="ltr">audio</code>. أي جملة غير مسجّلة يقرؤها صوت الجهاز: <b>'+voiceName+'</b>. العدد الكلي: <b>'+Object.keys(PHRASES).length+'</b> جملة.</p>'));
  const wrap=h('<div class="scriptwrap"><table><thead><tr><th>اسم الملف</th><th>النص</th><th>الحالة</th><th></th></tr></thead><tbody></tbody></table></div>');
  const tb=wrap.querySelector('tbody');
  Object.entries(PHRASES).forEach(([k,t])=>{ const tr=h('<table><tr><td><code>'+k+'.mp3</code></td><td>'+t+'</td><td>'+(recorded.has(k)?'<span class="pill">مسجّل</span>':'<span class="pill off">صوت الجهاز</span>')+'</td><td><button>استماع</button></td></tr></table>').querySelector('tr'); tr.querySelector('button').onclick=()=>say([k],false); tb.append(tr); });
  $stage.append(wrap);
}

document.getElementById('replay').onclick=()=>say(lastSay.length?lastSay:['welcome'],false);
